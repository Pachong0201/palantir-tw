[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palantir-tw"
version = "0.1.0"
description = "台湾开源情报平台：本体驱动融合 + 断言级证据分级 + 人在回路"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
    "pydantic-settings>=2.0",
    "Jinja2>=3.1",
    "typer>=0.12",
    "httpx>=0.27",
    "python-multipart",
    "feedparser>=6.0",
    "APScheduler>=3.10",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
palantir-tw = "palantir_tw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
palantir_tw = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
